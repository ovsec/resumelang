<div class="gallery-card" data-theme="{{.Theme}}" onclick="applyTheme('{{.Theme}}')">
  <div class="gallery-thumb">
    <iframe srcdoc="{{.HTML}}" sandbox loading="lazy"></iframe>
    <div class="gallery-thumb-cover"></div>
  </div>
  <div class="gallery-card-body">
    <span class="gallery-card-name">{{.Theme}}</span>
  </div>
</div>
