<header class="editor-nav">
  <div class="editor-nav-left">
    <a class="nav-brand" href="/" title="Home">
      <img src="/web/assets/logo.svg" alt="resumelang" height="20">
    </a>
    <span class="nav-sep"></span>
    <span style="font-size:13px;font-weight:600;color:var(--text)">My Resumes</span>
  </div>
  <div class="editor-nav-right">
    <a class="nav-ghost" href="/editor">New resume</a>
    <span class="nav-divider"></span>
    {{if .User}}
    <div class="user-menu" id="user-menu">
      <button class="user-menu-trigger" id="user-menu-trigger" type="button" aria-haspopup="true" aria-expanded="false">
        {{if .User.Avatar}}<img src="{{.User.Avatar}}" alt="" width="22" height="22" class="user-menu-avatar">
        {{else}}<span class="user-menu-initials"><svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="7" cy="5" r="2.5"/><path d="M2 12c0-2.761 2.239-5 5-5s5 2.239 5 5"/></svg></span>{{end}}
        <span class="user-menu-name">{{if .User.Name}}{{.User.Name}}{{else}}{{.User.Login}}{{end}}</span>
        <svg class="user-menu-chevron" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m2 4 3 3 3-3"/></svg>
      </button>
      <div class="user-menu-dropdown" id="user-menu-dropdown" hidden>
        <a href="/editor" class="user-menu-item">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="12" height="12" rx="2"/><path d="M4 5h6M4 7.5h6M4 10h3"/></svg>
          Editor
        </a>
        <div class="user-menu-sep"></div>
        <a href="/auth/logout" class="user-menu-item user-menu-item-danger">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h3M9 10l4-3-4-3M13 7H5"/></svg>
          Sign out
        </a>
      </div>
    </div>
    {{end}}
  </div>
</header>

<main class="dash-main">
  {{if not .Resumes}}
  <div class="dash-empty">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.3"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    <p>No saved resumes yet.</p>
    <a class="nav-primary" href="/editor">Create one</a>
  </div>
  {{else}}
  <div class="dash-grid" id="resume-list">
    {{range .Resumes}}
    <div class="dash-card" id="card-{{.ID}}">
      <div class="dash-card-body">
        <span class="dash-card-name">{{.Name}}</span>
        <span class="dash-card-date">{{.UpdatedAt.Format "Jan 2, 2006"}}</span>
      </div>
      <div class="dash-card-actions">
        <a class="btn-sm" href="/editor?id={{.ID}}">Edit</a>
        <button class="btn-sm btn-sm-share"
                hx-get="/partials/share-modal?resume_id={{.ID}}"
                hx-target="#modal-container"
                hx-swap="innerHTML">Share</button>
        <button class="btn-sm btn-sm-danger"
                hx-delete="/api/resumes/{{.ID}}"
                hx-target="#card-{{.ID}}"
                hx-swap="outerHTML swap:0.2s"
                hx-confirm="Delete {{.Name}}?">Delete</button>
      </div>
    </div>
    {{end}}
  </div>
  {{end}}
</main>
