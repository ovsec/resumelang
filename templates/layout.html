<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{.Title}}</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6CK12CCT0F"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-6CK12CCT0F');
  </script>
  <link rel="icon" href="/web/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/web/vendor/codemirror.min.css">
  <link rel="stylesheet" href="/web/vendor/cm-material-darker.min.css">
  <link rel="stylesheet" href="/web/vendor/cm-foldgutter.css">
  <link rel="stylesheet" href="/web/styles.css">
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>
</head>
<body{{if .Themes}} class="editor-layout"{{else if .ViewPage}} class="view-body"{{end}}>
  {{embed}}
  <div id="modal-container"></div>
  <div id="status" class="status-toast" aria-live="polite"></div>
  <script>
    (function(){
      var t=document.getElementById('user-menu-trigger'),
          d=document.getElementById('user-menu-dropdown');
      if(!t||!d)return;
      t.addEventListener('click',function(e){
        e.stopPropagation();
        var open=!d.hidden;
        d.hidden=open;
        t.setAttribute('aria-expanded',String(!open));
      });
      document.addEventListener('click',function(){
        d.hidden=true;
        t.setAttribute('aria-expanded','false');
      });
      d.addEventListener('click',function(e){e.stopPropagation();});
      document.addEventListener('keydown',function(e){
        if(e.key==='Escape'&&!d.hidden){d.hidden=true;t.setAttribute('aria-expanded','false');t.focus();}
      });
    })();
  </script>
</body>
</html>
