<header class="topbar view-topbar">
  <a class="brand" href="/" aria-label="resumelang home">
    <img class="brand-logo" src="/web/assets/logo.svg" alt="resumelang" height="22">
  </a>
  <div class="view-meta">
    <span id="resume-title" class="resume-title">resume</span>
    <span id="resume-sub" class="resume-sub"></span>
  </div>
  <nav class="view-tabs" role="tablist">
    <button class="tab active" role="tab" data-target="pane-preview">Preview</button>
    <button class="tab" role="tab" data-target="pane-source">Source</button>
  </nav>
  <div class="view-actions">
    <div class="theme-picker" id="theme-picker">
      <button class="theme-picker-btn" id="theme-picker-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
        <svg class="theme-picker-icon" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 10C1 8.5 1.5 6.5 3 5.5L7.5 1l3 3L6 8.5C4.5 9.5 2.5 10.5 1.5 10z"/><path d="M7.5 1l1-1 2 2-1 1"/></svg>
        <span id="theme-picker-label">—</span>
        <svg class="theme-picker-chevron" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m2 4 3 3 3-3"/></svg>
      </button>
      <ul class="theme-picker-menu" id="theme-picker-menu" role="listbox" hidden></ul>
    </div>
    <button id="btn-print" class="btn">Print / PDF</button>
    <button id="btn-copy-yaml" class="btn">Copy YAML</button>
    <span class="view-nav-divider"></span>
    <a id="btn-open-editor" class="btn btn-ghost" href="/editor">Open in editor</a>
    {{if .User}}
    <div class="user-menu" id="user-menu">
      <button class="user-menu-trigger" id="user-menu-trigger" type="button" aria-haspopup="true" aria-expanded="false" data-uid="{{.User.Provider}}-{{.User.ID}}">
        {{if .User.Avatar}}<img src="{{.User.Avatar}}" alt="" width="22" height="22" class="user-menu-avatar">
        {{else}}<span class="user-menu-initials"><svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="7" cy="5" r="2.5"/><path d="M2 12c0-2.761 2.239-5 5-5s5 2.239 5 5"/></svg></span>{{end}}
        <span class="user-menu-name">{{if .User.Name}}{{.User.Name}}{{else}}{{.User.Login}}{{end}}</span>
        <svg class="user-menu-chevron" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m2 4 3 3 3-3"/></svg>
      </button>
      <div class="user-menu-dropdown" id="user-menu-dropdown" hidden>
        <a href="/editor" class="user-menu-item">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="12" height="12" rx="2"/><path d="M4 5h6M4 7.5h6M4 10h3"/></svg>
          Editor
        </a>
        <a href="/dashboard" class="user-menu-item">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="5" height="5" rx="1"/><rect x="8" y="1" width="5" height="5" rx="1"/><rect x="1" y="8" width="5" height="5" rx="1"/><rect x="8" y="8" width="5" height="5" rx="1"/></svg>
          My Resumes
        </a>
        <div class="user-menu-sep"></div>
        <a href="/auth/logout" class="user-menu-item user-menu-item-danger">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h3M9 10l4-3-4-3M13 7H5"/></svg>
          Sign out
        </a>
      </div>
    </div>
    {{else}}
    <a class="btn btn-ghost" href="/login">Sign in</a>
    {{end}}
  </div>
</header>

<main class="view-main">
  <section id="pane-preview" class="view-pane">
    <iframe id="preview" title="resume preview"></iframe>
  </section>
  <section id="pane-source" class="view-pane" hidden>
    <pre id="source"><code id="source-code"></code></pre>
  </section>
</main>

<div id="pw-overlay" class="pw-overlay" hidden>
  <div class="pw-panel">
    <p class="pw-label">This resume is password protected.</p>
    <input id="pw-input" type="password" class="pw-input" placeholder="Enter password" autofocus>
    <button id="pw-submit" class="nav-primary" style="width:100%">Unlock</button>
    <p id="pw-error" class="pw-error" hidden>Wrong password — try again.</p>
  </div>
</div>

<div id="view-error" class="view-error" hidden></div>

<script src="/web/vendor/handlebars.min.js"></script>
<script src="/web/vendor/js-yaml.min.js"></script>
<script src="/web/view.js"></script>
