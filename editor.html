<script>
window.addEventListener('DOMContentLoaded', function() {
  initEditor();
  
  var fromUrl = loadFromUrl();
  var fromStorage = loadFromStorage();
  
  // Use default only if nothing in URL or storage
  var initial = fromUrl || fromStorage;
  
  document.getElementById('editor').value = initial || DEFAULT_YAML;
  currentYaml = document.getElementById('editor').value;
  render();
});

window.addEventListener('hashchange', function() {
  var fromUrl = loadFromUrl();
  if (fromUrl) {
    document.getElementById('editor').value = fromUrl;
    currentYaml = fromUrl;
    render();
  }
});
</script>
