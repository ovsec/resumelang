<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>resumelang — editor</title>
  <link rel="icon" href="/web/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/web/vendor/codemirror.min.css">
  <link rel="stylesheet" href="/web/vendor/cm-material-darker.min.css">
  <link rel="stylesheet" href="/web/styles.css">
</head>
<body class="editor-layout">

  <!-- Topbar -->
  <header class="editor-nav">
    <div class="editor-nav-left">
      <a class="nav-brand" href="/" title="Home">
        <img src="/web/assets/logo.svg" alt="resumelang" height="20">
      </a>
      <span class="nav-sep"></span>
      <div class="theme-cluster">
        <div class="theme-picker" id="theme-picker">
          <button class="theme-picker-btn" id="theme-picker-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
            <svg class="theme-picker-icon" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 10C1 8.5 1.5 6.5 3 5.5L7.5 1l3 3L6 8.5C4.5 9.5 2.5 10.5 1.5 10z"/><path d="M7.5 1l1-1 2 2-1 1"/></svg>
            <span id="theme-picker-label">—</span>
            <svg class="theme-picker-chevron" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m2 4 3 3 3-3"/></svg>
          </button>
          <ul class="theme-picker-menu" id="theme-picker-menu" role="listbox" hidden></ul>
        </div>
        <select id="theme-select" style="display:none" aria-hidden="true"></select>
        <button id="btn-gallery" type="button" class="nav-icon-btn" title="Browse all themes">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="5" height="5" rx="1"/><rect x="8" y="1" width="5" height="5" rx="1"/><rect x="1" y="8" width="5" height="5" rx="1"/><rect x="8" y="8" width="5" height="5" rx="1"/></svg>
        </button>
      </div>
    </div>

    <div class="editor-nav-right">
      <a class="nav-ghost" href="https://docs.resumelang.dev" target="_blank" rel="noopener">Docs</a>
      <button id="btn-share" class="nav-ghost" title="Copy shareable read-only link">Share</button>
      <button id="btn-print" class="nav-ghost">Print</button>
      <button id="btn-download" class="nav-primary">Download</button>
      <span class="nav-divider"></span>
      <div id="user-widget" class="user-widget" hidden>
        <a id="user-link" class="user-chip" href="#" title="Sign out">
          <img id="user-avatar" alt="" width="20" height="20">
          <span id="user-name"></span>
        </a>
        <a id="user-signin" class="nav-ghost" href="/login">Sign in</a>
      </div>
    </div>

    <div id="status" class="status-toast" aria-live="polite"></div>
  </header>

  <!-- Workspace -->
  <div class="workspace" id="split">

    <!-- Editor pane -->
    <div class="ws-pane editor-pane">
      <div class="pane-bar">
        <span class="pane-title">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="1" y="1" width="10" height="10" rx="2.5"/><path d="M3.5 4.5h5M3.5 6.5h5M3.5 8.5h3"/></svg>
          resume.yml
        </span>
        <span class="pane-badge mobile-hide">YAML</span>
        <button id="btn-mobile-render" class="btn-mobile-render" type="button">Render</button>
      </div>
      <textarea id="editor"></textarea>
    </div>

    <!-- Splitter -->
    <div class="ws-splitter" id="splitter" role="separator" aria-label="Resize panes"></div>

    <!-- Preview pane -->
    <div class="ws-pane preview-pane">
      <div class="pane-bar">
        <div class="pane-tabs">
          <button class="pane-tab active" data-view="preview">Preview</button>
          <button class="pane-tab" data-view="yaml">YAML</button>
        </div>
        <div class="pane-bar-end">
          <button id="render-toggle" class="render-toggle" type="button" title="Live — click to switch to manual">
            <span class="render-toggle-dot"></span>
            <span class="render-toggle-label">live</span>
          </button>
          <button id="btn-render" class="btn-render" type="button" hidden>Render</button>
        </div>
      </div>
      <div class="pane-view" id="view-preview">
        <iframe id="preview" title="resume preview"></iframe>
      </div>
      <div class="pane-view pane-yaml-view" id="view-yaml" hidden>
        <pre id="yaml-pre"><code id="yaml-code"></code></pre>
      </div>
    </div>

  </div>

  <!-- Gallery modal -->
  <div id="gallery-modal" class="gallery-modal" hidden aria-modal="true" role="dialog">
    <div class="gallery-backdrop" data-close></div>
    <div class="gallery-panel">
      <header class="gallery-head">
        <h2 class="gallery-title">Themes</h2>
        <div class="gallery-search-wrap">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5"/><path d="m13 13-3-3"/></svg>
          <input id="gallery-search" type="search" placeholder="Search…" autocomplete="off">
          <kbd>esc</kbd>
        </div>
        <span id="gallery-count" class="gallery-count"></span>
        <button class="gallery-close" data-close aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 1l12 12M13 1L1 13"/></svg>
        </button>
      </header>
      <div id="gallery-grid" class="gallery-grid"></div>
      <div id="gallery-loader" class="gallery-loader">
        <div class="gallery-spinner"></div>
        <span>rendering previews…</span>
      </div>
    </div>
  </div>

  <!-- Mobile bottom tab bar -->
  <nav class="mobile-tabs" id="mobile-tabs" aria-label="View">
    <button class="mobile-tab active" data-mobile-view="editor" type="button">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="14" height="14" rx="3"/><path d="M5 6.5h8M5 9h8M5 11.5h5"/></svg>
      <span>Edit</span>
    </button>
    <button class="mobile-tab" data-mobile-view="preview" type="button">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 9C3.5 5 6 3 9 3s5.5 2 7.5 6c-2 4-4.5 6-7.5 6s-5.5-2-7.5-6z"/><circle cx="9" cy="9" r="2.5"/></svg>
      <span>Preview</span>
    </button>
  </nav>

  <script src="/web/vendor/codemirror.min.js"></script>
  <script src="/web/vendor/yaml.min.js"></script>
  <script src="/web/vendor/handlebars.min.js"></script>
  <script src="/web/vendor/js-yaml.min.js"></script>
  <script src="/web/editor.js"></script>
</body>
</html>
