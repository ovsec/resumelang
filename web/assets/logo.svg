<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 44" aria-label="resumelang" role="img">
  <defs>
    <linearGradient id="rl-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b95ff"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="rl-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Mark: document with folded code-bracket corner, content lines, cursor caret -->
  <g transform="translate(2 4)">
    <!-- Page body with cut corner -->
    <path d="M6 0 H26 L36 10 V30 a6 6 0 0 1 -6 6 H6 a6 6 0 0 1 -6 -6 V6 a6 6 0 0 1 6 -6 Z"
          fill="url(#rl-grad)"/>
    <!-- Folded corner triangle -->
    <path d="M26 0 V8 a2 2 0 0 0 2 2 H36 Z" fill="#ffffff" fill-opacity="0.22"/>
    <!-- Top shine -->
    <path d="M6 0 H26 L36 10 V14 H0 V6 a6 6 0 0 1 6 -6 Z" fill="url(#rl-shine)"/>

    <!-- Resume content lines -->
    <rect x="7" y="14" width="14" height="2.6" rx="1.3" fill="#ffffff"/>
    <rect x="7" y="19.5" width="22" height="1.8" rx="0.9" fill="#ffffff" fill-opacity="0.78"/>
    <rect x="7" y="23.6" width="22" height="1.8" rx="0.9" fill="#ffffff" fill-opacity="0.62"/>
    <rect x="7" y="27.7" width="14" height="1.8" rx="0.9" fill="#ffffff" fill-opacity="0.62"/>

    <!-- Terminal cursor underscore -->
    <rect x="24" y="29" width="6" height="2" rx="1" fill="#ffffff">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Wordmark -->
  <g transform="translate(48 0)" fill="currentColor">
    <text x="0" y="29"
          font-family="Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif"
          font-weight="700"
          font-size="20"
          letter-spacing="-0.6">resume<tspan font-weight="500" fill="#6366f1">lang</tspan></text>
  </g>
</svg>
