version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: resumelang
    main: .
    binary: resumelang
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/ovsec/resumelang/cmd.Version={{.Version}}

archives:
  - id: resumelang
    name_template: "resumelang_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: "resumelang_{{ .Version }}_checksums.txt"
  algorithm: sha256

release:
  github:
    owner: ovsec
    name: resumelang
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"

brews:
  - name: resumelang
    homepage: https://resumelang.dev
    description: "Resume DSL compiler and live editor. One resume.yml → HTML, JSON, Markdown, ATS text."
    license: MIT
    repository:
      owner: ovsec
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    install: |
      bin.install "resumelang"
    test: |
      system "#{bin}/resumelang", "version"

scoops:
  - name: resumelang
    homepage: https://resumelang.dev
    description: "Resume DSL compiler and live editor."
    license: MIT
    repository:
      owner: ovsec
      name: scoop-resumelang
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"

# winget: disabled — requires forking microsoft/winget-pkgs manually + separate PAT
