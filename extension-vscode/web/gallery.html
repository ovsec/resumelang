<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none';
             style-src __CSP__ 'unsafe-inline';
             script-src __CSP__;
             font-src __CSP__ data:;
             img-src __CSP__ https: data:;
             frame-src 'self' data: blob:;
             connect-src 'none';" />
  <title>ResumeLang — Theme Gallery</title>
  <link rel="stylesheet" href="__GALLERY_CSS__" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="__LOGO__" alt="resumelang" height="20">
      <span class="title">Theme Gallery</span>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="search" placeholder="Search themes…" autocomplete="off" autofocus />
      <span class="kbd">esc</span>
    </div>
    <div class="actions">
      <span id="count" class="count"></span>
      <button id="btn-close" class="btn ghost" title="Close (Esc)">Close</button>
    </div>
  </header>

  <main id="grid" class="grid"></main>

  <div id="loader" class="loader">
    <div class="spinner"></div>
    <span class="loader-text">rendering thumbnails…</span>
  </div>

  <footer class="statusbar">
    <span id="status">click a theme to apply</span>
    <span class="grow"></span>
    <span id="active-info"></span>
  </footer>

  <script src="__GALLERY_JS__"></script>
</body>
</html>
